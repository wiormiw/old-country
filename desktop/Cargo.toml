[workspace]
resolver = "3"
members = ["shared", "app", "src-tauri"]
# The UI crate targets wasm32 (built by Trunk); plain `cargo build`/`cargo test` cover the native crates.
default-members = ["shared", "src-tauri"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]
shared = { path = "shared" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
# Not `true`: full stripping removes the wasm target_features section, and wasm-opt then rejects
# the UI's bulk-memory instructions. Debug info is still dropped.
strip = "debuginfo"

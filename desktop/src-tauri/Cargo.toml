[package]
name = "old-country"
description = "old-country desktop: a native player for the old-country music server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "old_country_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-store = "2.5.1"
tauri-plugin-log = "2.10.2"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
# native-tls (system OpenSSL) rather than the default aws-lc, which needs CMake to build.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "native-tls", "http2"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
futures-util = "0.3"
log = "0.4"
# Playback: rodio only as the output; decoding is ours (symphonia 0.6 + libopus), see src/player.
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-adapter-libopus = { version = "0.3.0", default-features = false }
# Media keys and the desktop's media controls (MPRIS on Linux).
souvlaki = "0.9.3"
fastrand = "2.5.0"
# Live updates from the server's SignalR hub, spoken directly over a WebSocket (see src/live.rs).
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

# Windows and macOS have no system libopus to link, so they build the bundled copy (needs CMake).
[target.'cfg(not(target_os = "linux"))'.dependencies]
symphonia-adapter-libopus = { version = "0.3.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6.5"

[lints]
workspace = true

# Builds the desktop apps (Linux, Windows, macOS) and the Android app, and attaches them to a draft
# GitHub release, to check over and then publish.
#
#   git tag v0.1.0 && git push origin v0.1.0     # or run it from the Actions tab
#
# The release is named after the version in desktop/Cargo.toml (keep it in step with the tag).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04 # older glibc, so the .deb/.rpm/AppImage run on more distributions
            args: ""
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xdg-utils \
            libopus-dev libasound2-dev libdbus-1-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.target && format(',{0}', matrix.target) || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: ${{ matrix.target }}

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: old-country v__VERSION__
          releaseBody: See the README for installing on each system. The macOS app isn't notarized; the first time, right-click it and choose Open.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android
    needs: desktop # adds the APK to the draft release the desktop jobs made
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Version
        id: version
        run: echo "value=$(sed -nE 's/^version = "([^"]+)"/\1/p' desktop/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see README)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :app:testReleaseUnitTest :app:assembleRelease -PappVersion=${{ steps.version.outputs.value }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          apk="old-country_${VERSION}_android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release view "v$VERSION" >/dev/null 2>&1 \
            || gh release create "v$VERSION" --draft --title "old-country v$VERSION" --target "$GITHUB_SHA" --notes "See the README for installing on each system."
          gh release upload "v$VERSION" "$apk" --clobber

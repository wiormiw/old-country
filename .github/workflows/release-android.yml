# Builds the signed Android APK and attaches it to a draft GitHub release, to check over and then
# publish.
#
#   git tag android-v0.1.0 && git push origin android-v0.1.0     # or run it from the Actions tab
#
# The version is appVersion in android/gradle.properties; a tag that doesn't match it is refused.
# Signing needs the four ANDROID_* repository secrets (see the README).
name: Release Android

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        run: |
          version=$(sed -nE 's/^appVersion=(.+)$/\1/p' android/gradle.properties)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "android-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match android/gradle.properties' appVersion $version."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (see README)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build the signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache :app:testReleaseUnitTest :app:assembleRelease

      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="android-v$VERSION"
          apk="old-country_${VERSION}_android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --draft --target "$GITHUB_SHA" --title "old-country Android v$VERSION" \
                 --notes "Android 8 or later. Allow installing from your browser or file manager when asked; later versions install over this one. Set the server address in Settings on first start."
          gh release upload "$tag" "$apk" --clobber

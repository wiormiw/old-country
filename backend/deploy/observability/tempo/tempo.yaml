# Tempo in one process, with its data on the local disk. Traces arrive from Alloy over OTLP.
# The metrics generator makes request rate, error and duration metrics and the service graph
# from the spans, and writes them to Prometheus.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

compactor:
  compaction:
    # How long Tempo keeps traces. Set TEMPO_RETENTION in .env (default 7 days).
    block_retention: ${TEMPO_RETENTION:-168h}

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

usage_report:
  reporting_enabled: false
